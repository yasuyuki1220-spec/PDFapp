<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜かんたんPDF書類ツール</title>
<meta name="description" content="かんたんPDF書類ツールへのお問い合わせ窓口です。不具合のご報告やご要望をお待ちしています。">
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<header class="site"></header>
<main>
  <h1>お問い合わせ</h1>
  <p class="lead">不具合のご報告、ご要望、ご質問はこちらからお送りください。</p>

  <div class="card">
    <div id="withMail" hidden>
      <p style="margin-top:0">下記のメールアドレスまでご連絡ください。</p>
      <p><a id="mail" style="font-size:18px;font-weight:700"></a></p>
    </div>
    <div id="noMail">
      <p style="margin:0">お問い合わせ窓口は準備中です。</p>
    </div>
  </div>

  <h2>ご連絡の際のお願い</h2>
  <ul>
    <li>不具合は、お使いの機種(iPhone / Android / パソコン)とブラウザ名、操作の手順を添えていただけると助かります。</li>
    <li>ファイルそのものは当サイトに送信されないため、個人情報を含む書類を添付する必要はありません。</li>
    <li>返信までお時間をいただく場合があります。</li>
  </ul>
</main>
<footer class="site"></footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.CONTACT_EMAIL) {
    var a = document.getElementById("mail");
    a.textContent = window.CONTACT_EMAIL; a.href = "mailto:" + window.CONTACT_EMAIL;
    document.getElementById("withMail").hidden = false;
    document.getElementById("noMail").hidden = true;
  }
});
</script>
</body>
</html>
